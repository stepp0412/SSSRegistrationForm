<div class="container">
    <h1>Online Member User ID Registration</h1>
    <p class="required">* Required Field</p>

    <form id="registrationForm">

        <label>CRN / SS Number *</label>
        <input type="text" id="ssn">

        <label>Email Address *</label>
        <input type="email" id="email">

        <label>Confirm Email Address *</label>
        <input type="email" id="confirmEmail">

        <label>Preferred User ID *</label>
        <input type="text" id="userID">

        <label>Confirm Preferred User ID *</label>
        <input type="text" id="confirmUserID">

        <label>Surname / Last Name *</label>
        <input type="text" id="surname">

        <label>Given Name *</label>
        <input type="text" id="givenName">

        <label>Middle Name</label>
        <input type="text" id="middleName">

        <label>Date of Birth *</label>
        <input type="date" id="birthDate">

        <h2>Mailing Address</h2>

        <label>Room / Floor / Unit No. & Building Name</label>
        <input type="text">

        <label>House / Lot & Block No.</label>
        <input type="text">

        <label>Street</label>
        <input type="text">

        <label>Subdivision</label>
        <input type="text">

        <label>Barangay</label>
        <input type="text">

        <label>City / Municipality</label>
        <input type="text">

        <label>Province</label>
        <input type="text">

        <button type="submit">Register</button>
        <button type="reset">Clear</button>

    </form>
</div>
